            isFabOpen = !isFabOpen;
            const container = document.querySelector('.fab-container');
            const mainIcon = document.querySelector('.icon-main');
            if(isFabOpen) {
                container.classList.add('fab-active');
                mainIcon.classList.remove('fa-headset');
                mainIcon.classList.add('fa-times');
            } else {
                container.classList.remove('fab-active');
                mainIcon.classList.remove('fa-times');
                mainIcon.classList.add('fa-headset');
            }

                const ov = document.getElementById('sidebar-overlay');

                ov.classList.toggle('hidden', !isClosed);

            closeModal: (id) => document.getElementById(id).classList.remove('open'),

                    if(descEl) descEl.innerHTML = window.appLang.t('gmail_rule_desc');

                    const key = el.dataset.i18n;
                    if(dict[state.currentLang][key]) {
                        if(key === 'gmail_rule_desc') el.innerHTML = dict[state.currentLang][key];
                        else el.textContent = dict[state.currentLang][key];

                    const key = el.dataset.i18nPlaceholder;
                    if(dict[state.currentLang][key]) el.placeholder = dict[state.currentLang][key];

                    pText.setAttribute('data-i18n', 'no_account');
                    btnText.setAttribute('data-i18n', 'register_link');
                    btnText.setAttribute('onclick', 'authHandler.toggleMode()');
                } else {
                    pText.setAttribute('data-i18n', 'have_account');
                    btnText.setAttribute('data-i18n', 'login_link');
                    btnText.setAttribute('onclick', 'authHandler.toggleMode()');
                }
                ui.updateText(); 
            },

                authHandler.mode = 'login';
                authHandler.regStep = 1;
                document.getElementById('login-form').reset();
                document.getElementById('reg-form').reset();
                document.getElementById('login-form').classList.remove('hidden');
                document.getElementById('reg-form').classList.add('hidden');

                const btnText = document.querySelector('#switch-txt button');

                    pText.setAttribute('data-i18n', 'no_account');

                ui.updateText();

                e.preventDefault();

                const pass = document.getElementById('login-pass').value;
                const btn = e.target.querySelector('button[type="submit"]'); 
                ui.loading(btn, true);

                try {
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ input, password: pass })
                    });
                    const data = await res.json();
                    
                    if(data.success) {
                        localStorage.setItem('uid', data.uid);
                        state.userUid = data.uid;
                        window.location.reload();
                    } else {
                        ui.showError('auth-alert', data.message);

                    ui.showError('auth-alert', "Network Error");

                const userRegex = /^[a-zA-Z0-9_]{5,20}$/;

                if (!nameRegex.test(name)) return ui.showError('auth-alert', "Name: 3-25 chars, No Emojis/Special chars");

                if (!name || !user || !email) return ui.showError('auth-alert', "Fill all fields");

                ui.loading(btn, true);

                try {
                    const res = await fetch('/api/register', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},

                        <div>
                            <label class="text-[10px] font-bold text-emerald-400 uppercase">${window.appLang.t('label_amt')}</label>
                            <input type="number" name="amt" class="w-full p-3 input-pro rounded-xl text-sm" placeholder="${window.appLang.t('ph_amt')}" required>
                        </div>
                        <button class="btn-primary w-full py-3 rounded-xl font-bold text-sm" data-i18n="withdraw">${window.appLang.t('withdraw')}</button>
                    </form>
                </div>`;
            document.getElementById('gen-modal-content').innerHTML = content;
            ui.openModal('gen-modal');
        };

        window.submitWithdraw = async (e, method) => {
            e.preventDefault();
            const num = e.target.num.value;
            const amt = parseFloat(e.target.amt.value);
            const minWithdraw = state.settings.minWithdraw || 100;

            if(amt < minWithdraw) {
                 return alert(window.appLang.t('min_withdraw_txt').replace('{amount}', minWithdraw));
            }
            
            const btn = e.target.querySelector('button');
            btn.disabled = true;

            try {
                const res = await fetch('/api/withdraw', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ uid: state.userUid, amount: amt, method: method, number: num })
                });
                const d = await res.json();
                if(d.success) {
                    ui.closeModal('gen-modal');
                    alert("Withdrawal Requested");
                    window.location.reload();
                } else {
                    alert(d.message);
                }
            } catch(e) { alert("Error"); }
            btn.disabled = false;
        };

        window.openWCPredictorModal = () => {
            const countries = [
                { name: "Bangladesh", flag: "🇧🇩" },
                { name: "Argentina", flag: "🇦🇷" },
                { name: "Brazil", flag: "🇧🇷" },
                { name: "Germany", flag: "🇩🇪" },
                { name: "France", flag: "🇫🇷" },
                { name: "Portugal", flag: "🇵🇹" },
                { name: "Spain", flag: "🇪🇸" },
                { name: "England", flag: "🇬🇧" },
                { name: "Saudi Arabia", flag: "🇸🇦" },
                { name: "Italy", flag: "🇮🇹" },
                { name: "USA", flag: "🇺🇸" }
            ];

            const current = state.selectedCountry;

            const content = `
                <div class="text-center">
                    <h3 class="text-lg font-bold text-white mb-3">${window.appLang.t('wc_predictor_title')}</h3>
                    <p class="text-xs text-emerald-300 mb-5 leading-relaxed">${window.appLang.t('wc_predictor_desc')}</p>
                    <div class="grid grid-cols-2 gap-2 max-h-64 overflow-y-auto p-1 mb-5">
                        ${countries.map(c => {
                            const isChosen = current === c.name;
                            return `
                            <button onclick="window.selectWCTeam('${c.name}')" class="flex items-center gap-3 p-3 rounded-xl border-2 transition text-left ${isChosen ? 'border-yellow-500 bg-yellow-950/50' : 'border-emerald-850 hover:border-emerald-500 bg-emerald-950'}">
                                <span class="text-2xl">${c.flag}</span>
                                <span class="text-xs font-bold text-white truncate">${c.name}</span>
                            </button>`;
                        }).join('')}
                    </div>
                </div>`;
            document.getElementById('gen-modal-content').innerHTML = content;
            ui.openModal('gen-modal');
        };

        window.selectWCTeam = async (teamName) => {
            if(confirm(`Are you sure you want to predict ${teamName} to win the FIFA World Cup 2026? This choice is locked once submitted.`)) {
                try {
                    localStorage.setItem('wc_prediction', teamName);
                    state.selectedCountry = teamName;
                    
                    await fetch('/api/select_country', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ uid: state.userUid, country: teamName })
                    });
                    
                    ui.closeModal('gen-modal');
                    alert("Team choice registered! Best of luck.");
                    app.nav('dashboard', true);
                } catch(e) {
                    ui.closeModal('gen-modal');
                    app.nav('dashboard', true);
                }
            }
        };

        window.claimTShirt = () => {
             alert("T-Shirt Claim request submitted! Our support team will contact you via WhatsApp / Phone to collect your delivery address.");
        };

        window.initPayment = (type, amount, detail) => {
            if (!state.userUid) return authHandler.trigger();
            
            const content = `
                <div id="pay-step-1" class="text-center">
                    <h3 class="text-base font-bold text-white mb-4">${window.appLang.t('select_method')}</h3>
                    <div class="space-y-3 mb-6">
                        <label class="cursor-pointer block">
                            <input type="radio" name="pay-method" value="Bkash" class="hidden payment-radio" checked>
                            <div class="p-4 rounded-xl border-2 border-emerald-900/50 flex items-center justify-between hover:border-emerald-700 transition">
                                <div class="flex items-center gap-3">
                                    <img src="https://iili.io/fWimLbt.jpg" class="w-10 h-10 rounded-full object-cover">
                                    <span class="font-bold text-white text-sm">${window.appLang.t('method_bkash')}</span>
                                </div>
                                <i class="fas fa-check-circle text-emerald-400 hidden check-icon"></i>
                            </div>
                        </label>
                        <label class="cursor-pointer block">
                            <input type="radio" name="pay-method" value="Nagad" class="hidden payment-radio">
                            <div class="p-4 rounded-xl border-2 border-emerald-900/50 flex items-center justify-between hover:border-emerald-700 transition">
                                <div class="flex items-center gap-3">
                                    <img src="https://iili.io/fWimtXn.jpg" class="w-10 h-10 rounded-full object-cover">
                                    <span class="font-bold text-white text-sm">${window.appLang.t('method_nagad')}</span>
                                </div>
                                <i class="fas fa-check-circle text-emerald-400 hidden check-icon"></i>
                            </div>
                        </label>
                    </div>
                    <button onclick="window.goToPayStep2('${type}', ${amount}, '${detail||''}')" class="btn-primary w-full py-3 rounded-xl font-bold" data-i18n="next">${window.appLang.t('next')}</button>
                </div>
                <div id="pay-step-2" class="hidden text-center"></div>`;
            document.getElementById('gen-modal-content').innerHTML = content;
            ui.openModal('gen-modal');
        };

        window.goToPayStep2 = (type, amount, detail) => {
            const methodVal = document.querySelector('input[name="pay-method"]:checked').value;
            const methodKey = methodVal.toLowerCase();
            const methodName = window.appLang.t('method_' + methodKey);
            const num = state.settings.paymentInfo ? state.settings.paymentInfo[methodKey] : "01721656930";
            
            const html = `
                <h3 class="text-base font-bold text-emerald-400 mb-1">${type}</h3>
                <p class="text-2xl font-bold mb-4 scoreboard-val">${amount}৳</p>
                <div class="bg-emerald-950/80 p-4 rounded-xl mb-4 border border-emerald-800/40">
                    <p class="text-[10px] text-emerald-400">${window.appLang.t('pay_step2_header')}</p>
                    <p class="text-base font-mono font-bold text-white flex items-center justify-center gap-2 mt-1">
                        <span id="pay-num-txt">${num}</span> 
                        <button onclick="window.copyPayNum()" class="text-emerald-400 hover:text-emerald-300 p-1"><i class="fas fa-copy"></i></button>
                    </p>
                    <p class="text-[10px] text-emerald-400 mt-1">(${methodName})</p>
                </div>
                <form onsubmit="window.submitPayment(event, '${type}', ${amount}, '${detail||''}', '${methodVal}')" class="space-y-3">
                    <input type="text" id="trx-id" placeholder="${window.appLang.t('trx_ph')}" class="w-full p-3 input-pro rounded-xl text-sm" required>
                    <div class="flex gap-2">
                        <button type="button" onclick="document.getElementById('pay-step-1').classList.remove('hidden');document.getElementById('pay-step-2').classList.add('hidden')" class="w-1/3 py-3 bg-emerald-950 text-emerald-300 border border-emerald-800/40 rounded-xl font-bold">${window.appLang.t('back')}</button>
                        <button type="submit" class="btn-primary w-2/3 py-3 rounded-xl font-bold" data-i18n="submit">${window.appLang.t('submit')}</button>
                    </div>
                </form>`;
            
            const s2 = document.getElementById('pay-step-2');
            s2.innerHTML = html;
            document.getElementById('pay-step-1').classList.add('hidden');
            s2.classList.remove('hidden');
        };

        window.copyPayNum = () => {
             const num = document.getElementById('pay-num-txt').innerText;
             navigator.clipboard.writeText(num);
             alert(window.appLang.t('copied'));
        };

        window.submitPayment = async (e, type, amount, detail, method) => {
            e.preventDefault();
            const trx = document.getElementById('trx-id').value;
            
            let endpoint = '/api/buy_plan';
            if(type === 'Activation') endpoint = '/api/activate';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        uid: state.userUid, 
                        amount, 
                        trxId: trx, 
                        method, 
                        planName: detail 
                    })
                });
                const d = await res.json();
                if(d.success) {
                    ui.closeModal('gen-modal');
                    alert("Request Submitted. Status: Pending");
                    window.location.reload();
                } else {
                    alert(d.message);
                }
            } catch(e) { alert("Error"); }
        };

        window.claimDaily = async (amount) => {
            try {
                const res = await fetch('/api/claim_daily', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ uid: state.userUid, amount: amount })
                });
                const d = await res.json();
                if(d.success) {
                    alert("Daily Income Claimed!");
                    window.location.reload();
                } else {
                    alert(d.message);
                }
            } catch(e) { alert("Error claiming reward"); }
        };

        window.claimRefReward = async (target, reward) => {
             try {
                const res = await fetch('/api/claim_ref_reward', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ uid: state.userUid, target: target, reward: reward })
                });
                const d = await res.json();
                if(d.success) {
                    alert("Reward Claimed!");
                    window.location.reload();
                } else {
                    alert(d.message);
                }
             } catch(e) { alert("Error"); }
        };

        window.submitGmail = async (e) => {
            e.preventDefault();
            const email = document.getElementById('gmail-input').value.trim();
            if(!email) return;

            try {
                const res = await fetch('/api/submit_gmail', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ uid: state.userUid, email })
                });
                const d = await res.json();
                if(d.success) {
                    alert("Gmail Submitted! Status: Pending");
                    app.nav('gmail_sell', true);
                } else {
                    alert(d.message);
                }
            } catch(e) { alert("Error"); }
        };

        window.copyPass = (el) => {
            const pass = state.gmailSettings.password;
            if(pass) {
                navigator.clipboard.writeText(pass);
                const originalBg = el.className;
                el.classList.remove('bg-emerald-950/80', 'border-emerald-800/40');
                el.classList.add('bg-emerald-900', 'border-emerald-500');
                setTimeout(() => {
                    el.className = originalBg;
                }, 500);
            }
        };

        window.runTask = async (tid, link, reward, btn) => {
            const w = window.open(link, '_blank');
            if(!w) return alert(window.appLang.t('allow_popup'));
            
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner border-emerald-400"></div>';
            
            setTimeout(async () => {
                try {
                    const res = await fetch('/api/complete_task', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ uid: state.userUid, taskId: tid, reward: reward })
                    });
                    const d = await res.json();
                    if(d.success) {
                        alert(`${window.appLang.t('task_complete')} +${reward}৳`);
                        window.location.reload();
                    } else {
                        alert(d.message);
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-play"></i>';
                    }
                } catch(e) { 
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-play"></i>';
                }
            }, 5000);
        };
        
        window.openProfileModal = () => {
            document.getElementById('modal-edit-fullname').value = state.data.fullname || '';
            document.getElementById('modal-edit-username').value = state.data.username || '';
            ui.openModal('profile-modal');
        };

        window.saveProfileModal = async () => {
            const full = document.getElementById('modal-edit-fullname').value.trim();
            const user = document.getElementById('modal-edit-username').value.trim();
            
            const nameRegex = /^[a-zA-Z0-9\s.,:]{3,25}$/;
            const userRegex = /^[a-zA-Z0-9_]{5,20}$/;

            if (!nameRegex.test(full)) return alert("Invalid Name");
            if (!userRegex.test(user)) return alert("Invalid Username");

            await fetch('/api/update_profile', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ uid: state.userUid, fullname: full, username: user })
            });
            window.location.reload();
        };

        window.copyRef = (btn) => {
            const link = btn.dataset.link;
            if(link) {
                navigator.clipboard.writeText(link);
                alert(window.appLang.t('copied'));
            }
        };

        window.handleLogoutClick = () => {
            if(confirm(window.appLang.t('logout_confirm'))) {
                localStorage.removeItem('uid');
                window.location.reload();
            }
        };

        document.addEventListener('DOMContentLoaded', app.init);
    </script>
</body>
</html>
